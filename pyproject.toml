[project]
name = "civil-scan"
version = "0.1.0"
description = "Street-scan inspection platform: decode scans to 3D, inventory road defects and assets, score condition, plan repairs, verify fixes. No ML model inside; the 3D decoder is pluggable."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=2.0",
    "python-multipart>=0.0.9",
    "inference-sdk>=1.8.5",
    "opencv-python-headless>=5.0.0.93",
    "cryptography>=50.0.2",
    "pypdf>=7.1.0",
    "httpx>=0.28.1",
    "websockets>=17.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
forge = ["gtsam>=4.2", "small-gicp>=1.0", "rosbags>=0.11", "scipy>=1.14", "pyyaml>=6"]

[project.scripts]
civil = "civil.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["civil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
